meta:
  name: school_izo
  institution: "Школа / Центр дополнительного образования"
  standard: "ГОСТ Р 7.0.97-2016 / Педагогический стандарт"
  description: "Оформление конспектов уроков ИЗО, технологических карт, справок мониторинга и методических разработок"
page:
  format: A4
  orientation: portrait
  margins:
    left_mm: 20.0
    right_mm: 15.0
    top_mm: 20.0
    bottom_mm: 20.0
  page_numbering:
    enabled: true
    start_from_page: 1
    position: bottom_center
    font_family: "Times New Roman"
    font_size_pt: 11.0
body:
  font_family: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 1.15
  first_line_indent_cm: 1.25
  alignment: justify
  spacing_before_pt: 0.0
  spacing_after_pt: 3.0
  widow_control: true
headings:
  h1:
    font_family: "Times New Roman"
    font_size_pt: 16.0
    bold: true
    italic: false
    all_caps: false
    alignment: center
    first_line_indent_cm: 0.0
    spacing_before_pt: 12.0
    spacing_after_pt: 6.0
    keep_with_next: true
    page_break_before: false
  h2:
    font_family: "Times New Roman"
    font_size_pt: 14.0
    bold: true
    italic: false
    all_caps: false
    alignment: left
    first_line_indent_cm: 1.25
    spacing_before_pt: 10.0
    spacing_after_pt: 4.0
    keep_with_next: true
    page_break_before: false
  h3:
    font_family: "Times New Roman"
    font_size_pt: 14.0
    bold: true
    italic: true
    all_caps: false
    alignment: left
    first_line_indent_cm: 1.25
    spacing_before_pt: 6.0
    spacing_after_pt: 2.0
    keep_with_next: true
    page_break_before: false
tables:
  font_family: "Times New Roman"
  font_size_pt: 12.0
  line_spacing: 1.0
  first_line_indent_cm: 0.0
  alignment: left
  header_bold: true
  header_repeat: true
  borders: true
  border_style: single
  border_color_hex: "000000"
  cell_margins_pt:
    top: 4.0
    bottom: 4.0
    left: 6.0
    right: 6.0
lists:
  bullet_char: "—"
  font_family: "Times New Roman"
  font_size_pt: 14.0
  line_spacing: 1.15
  first_line_indent_cm: 1.25
  left_indent_cm: 1.25
  spacing_before_pt: 0.0
  spacing_after_pt: 2.0
title_page:
  enabled: false
